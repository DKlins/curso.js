<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        /* Comentário em CSS */
        body{
            background-color: rgb(0, 0, 255);
            color: white;
            font: normal 20pt Arial;
        }
        h1{
            color: rgba(255, 255, 8, 0.849);
        }
    </style>
</head>
<body>
    <!--Comentário em HTML -->
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
        // converter para string --> string(n) ou n.toString()
        var n1 = Number(window.prompt('Digite o primeiro número')) //convertendo para numero
        var n2 = Number(window.prompt('Digite o segundo número'))
        var n3 = Number(window.prompt('Digite o terceiro número'))
        var n4 = Number(window.prompt('Digite o quarto número')) //convertendo para numero
        var soma = n1 + n2 + n3 + n4 //realizando a soma
        window.alert(`A soma dos valores ${n1}+${n2}+${n3}+${n4} é ${soma}`) //concatenar
    </script>
</body>
</html>
